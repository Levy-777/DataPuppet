[project]
name = "data-puppet"
version = "0.1.0"
description = "Servidor MCP para processamento robusto de dados massivos e automação web."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27.0",
    "duckdb>=1.5.0",
    "playwright>=1.60.0",
    "pandas>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
data-puppet = "server:main"
